services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54322:5432"
    volumes:
      - cashclose_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CASHCLOSE_API_URL: ${NEXT_PUBLIC_CASHCLOSE_API_URL:-http://localhost:8000}
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      CASHCLOSE_API_URL: http://api:8000
      NEXT_PUBLIC_CASHCLOSE_API_URL: ${NEXT_PUBLIC_CASHCLOSE_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  cashclose_postgres:
