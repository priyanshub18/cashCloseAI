[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cashclose-ai"
version = "0.1.0"
description = "Agentic cash reconciliation with deterministic financial controls"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=2.30,<3",
  "ortools>=9.11,<10",
  "polars>=1.25,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.12,<3",
  "python-multipart>=0.0.20,<1",
  "rapidfuzz>=3.12,<4",
  "redis>=5.2,<6",
  "rq>=2.1,<3",
  "supabase>=2.15,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "pytest-cov>=6,<7"]

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

